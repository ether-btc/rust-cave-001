[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rust-cave-001"
version = "0.3.0"
description = "High-performance text compression — Rust-backed Python bindings for sentence-aware NLP compression and token optimization."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ether-btc" }
]
keywords = ["compression", "text", "hermes-agent", "llm", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ether-btc/rust-cave-001"
Repository = "https://github.com/ether-btc/rust-cave-001"
BugTracker = "https://github.com/ether-btc/rust-cave-001/issues"

[tool.maturin]
module-name = "rust_cave_001"
bindings = "pyo3"
features = ["pyo3/abi3-py310"]
