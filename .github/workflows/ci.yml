name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-dev
          pip install --quiet maturin pytest

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust clippy
        run: cargo clippy -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Build and install
        env:
          PYO3_PYTHON: python3.10
          PYTHON: python3.10
        run: maturin build --release --auditwheel skip -o dist/

      - name: Install built wheel
        run: pip install dist/*.whl --force-reinstall --no-deps

      - name: Run Python tests
        run: pytest tests/ -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit