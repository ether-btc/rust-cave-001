name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unset PYO3_PYTHON so maturin auto-detects from PATH (setup-python sets PATH)
      PYO3_PYTHON: ""
      PYTHON: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-

      - name: Install Python dependencies
        run: |
          # Diagnose environment
          python3 --version && which python3
          ls /usr/lib/x86_64-linux-gnu/libpython* 2>/dev/null || echo "no x86_64 libpython"
          # Install dev headers (maturin auto-detects Python from PATH)
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev || true
          pip install --quiet maturin pytest

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust clippy
        run: cargo clippy -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Build and install
        run: maturin build --release --auditwheel skip -o dist/

      - name: Install built wheel
        run: pip install dist/*.whl --force-reinstall --no-deps

      - name: Run Python tests
        run: pytest tests/ -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/rust-cave-001/
    env:
      PYO3_PYTHON: ""
      PYTHON: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev || true
          pip install --quiet maturin

      - name: Build and publish to PyPI
        env:
          MATURIN_PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: maturin publish --release --skip-auditwheel