name: CI

on:
  push:
    branches: [master, main]
    tags: [v*]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unset PYO3_PYTHON so maturin auto-detects from PATH (setup-python sets PATH)
      PYO3_PYTHON: ""
      PYTHON: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-

      - name: Install Python dependencies
        run: |
          # Diagnose environment
          python3 --version && which python3
          ls /usr/lib/x86_64-linux-gnu/libpython* 2>/dev/null || echo "no x86_64 libpython"
          # Install dev headers (maturin auto-detects Python from PATH)
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev || true
          pip install --quiet maturin pytest ruff

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust clippy
        run: cargo clippy -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Build and install
        run: maturin build --release --auditwheel skip -o dist/

      - name: Install built wheel
        run: pip install dist/*.whl --force-reinstall --no-deps

      - name: Run Python tests
        run: pytest tests/ -v

      - name: Run ruff lint
        run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  validate-versions:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Validate version consistency
        run: |
          # Extract version from Cargo.toml (handles both single and double quotes)
          CARGO_VERSION=$(grep '^version\s*=' Cargo.toml | head -1 | sed "s/version\s*=\s*[\"']\([^\"']*\)[\"']/\1/")
          
          # Extract version from pyproject.toml (handles both single and double quotes)
          PYPROJECT_VERSION=$(grep '^version\s*=' pyproject.toml | head -1 | sed "s/version\s*=\s*[\"']\([^\"']*\)[\"']/\1/")
          
          # Extract version from git tag
          TAG_VERSION=$(echo "${GITHUB_REF#refs/tags/v}")
          
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          echo "Git tag version: $TAG_VERSION"
          
          # Check Cargo.toml matches tag
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          
          # Check pyproject.toml matches tag
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          
          echo "::notice::All versions match: $TAG_VERSION"

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit, validate-versions]
    environment:
      name: pypi
      url: https://pypi.org/project/rust-cave-001/
    env:
      PYO3_PYTHON: ""
      PYTHON: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev || true
          pip install --quiet maturin twine

      - name: Build wheel
        run: maturin build --release --auditwheel skip -o dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.whl --non-interactive

      - name: Verify PyPI publication
        run: |
          # Extract version from tag
          TAG_VERSION=$(echo "${GITHUB_REF#refs/tags/v}")
          
          # Wait for PyPI indexing and retry if needed (can take 2-5 min during high load)
          echo "Waiting for PyPI indexing of rust-cave-001==${TAG_VERSION}..."
          MAX_RETRIES=6
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if pip install rust-cave-001==${TAG_VERSION} --quiet 2>/dev/null; then
              echo "Successfully installed from PyPI"
              break
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "PyPI indexing not complete, waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            else
              echo "::error::PyPI indexing timed out after $((MAX_RETRIES * RETRY_DELAY)) seconds"
              exit 1
            fi
          done
          
          # Verify the installed version matches
          INSTALLED_VERSION=$(python3 -c "import rust_cave_001; print(rust_cave_001.__version__)" 2>/dev/null || echo "FAILED")
          
          if [ "$INSTALLED_VERSION" = "FAILED" ]; then
            echo "::error::Failed to import rust_cave_001 after installation"
            exit 1
          fi
          
          if [ "$INSTALLED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Installed version ($INSTALLED_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          
          # Cleanup test installation
          pip uninstall -y rust-cave-001 --quiet 2>/dev/null || true
          
          echo "::notice::Successfully verified rust-cave-001 v${TAG_VERSION} on PyPI"