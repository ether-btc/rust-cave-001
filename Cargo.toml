[package]
name = "rust-cave-001"
version = "0.3.0"
edition = "2021"
description = "Deterministic text compression for LLM token reduction — Rust-native Caveman Compression with Python bindings"
authors = ["ether-btc"]
license = "MIT"
repository = "https://github.com/ether-btc/rust-cave-001"
homepage = "https://github.com/ether-btc/rust-cave-001"

[lib]
name = "rust_cave_001"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.2", features=["extension-module","abi3-py310"] }
lz4 = "1.0"
regex = "1.10.0"
